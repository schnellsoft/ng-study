<div class="shell">
  <header class="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">{{ title() }}</p>
        <p class="brand-tag">Study shell</p>
      </div>
    </div>

    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="scheme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <span class="theme-label">{{ scheme() === 'dark' ? 'Dark' : 'Light' }}</span>
      <span class="theme-hint">{{ scheme() === 'dark' ? 'Switch to light' : 'Switch to dark' }}</span>
    </button>
  </header>

  <aside class="sidebar sidebar-left" aria-label="Left sidebar">
    <h2>Left</h2>
    <p>Navigation and filters live here.</p>
  </aside>

  <main class="main">
    <div class="main-toolbar">
      <h1>Workspace</h1>
      <p>{{ boxWidth() | number: '1.0-1' }} × {{ boxHeight() | number: '1.0-1' }} rem</p>
    </div>

    <div class="canvas">
      <div
        class="resize-box"
        [style.width.rem]="boxWidth()"
        [style.height.rem]="boxHeight()"
        role="group"
        aria-label="Resizable rectangle"
      >
        <span class="resize-label">Drag edges to resize</span>

        <button
          type="button"
          class="handle handle-n"
          aria-label="Resize from top"
          (pointerdown)="onResizePointerDown($event, 'n')"
        ></button>
        <button
          type="button"
          class="handle handle-s"
          aria-label="Resize from bottom"
          (pointerdown)="onResizePointerDown($event, 's')"
        ></button>
        <button
          type="button"
          class="handle handle-e"
          aria-label="Resize from right"
          (pointerdown)="onResizePointerDown($event, 'e')"
        ></button>
        <button
          type="button"
          class="handle handle-w"
          aria-label="Resize from left"
          (pointerdown)="onResizePointerDown($event, 'w')"
        ></button>
        <button
          type="button"
          class="handle handle-ne"
          aria-label="Resize from top right"
          (pointerdown)="onResizePointerDown($event, 'ne')"
        ></button>
        <button
          type="button"
          class="handle handle-nw"
          aria-label="Resize from top left"
          (pointerdown)="onResizePointerDown($event, 'nw')"
        ></button>
        <button
          type="button"
          class="handle handle-se"
          aria-label="Resize from bottom right"
          (pointerdown)="onResizePointerDown($event, 'se')"
        ></button>
        <button
          type="button"
          class="handle handle-sw"
          aria-label="Resize from bottom left"
          (pointerdown)="onResizePointerDown($event, 'sw')"
        ></button>
      </div>
    </div>

    <router-outlet />
  </main>

  <aside class="sidebar sidebar-right" aria-label="Right sidebar">
    <h2>Right</h2>
    <p>Inspector and details live here.</p>
  </aside>

  <footer class="footer">
    <span>a001 layout</span>
    <span>Header · Sidebars · Main · Footer</span>
  </footer>
</div>
